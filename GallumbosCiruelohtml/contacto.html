<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <a class= "logo" href="">
        <img src="logo.png" alt="Logo Gallumbos Ciruelo"></a>
    <h1>Gallumbos Ciruelo</h1>
    <h2>"La mejor funda para tu abuelo"</h2>
    <nav>
        <ul>
            <li><a href="index.html"> <strong>Inicio</strong></a></li>
            <li><a href="productos.html"><strong>Productos</strong></a></li>
            <li><a href="coleccion.html"><strong>Colección</strong></a></li>
            <li><a href="sobrenosotros.html"><strong>Sobre nosotros</strong></a></li>
        </ul>
    </nav>
    </header>
    <main>
        <section class="formulario">
            <form>
                <fieldset>
                    <legend>Contáctanos</legend>
                    <label>Nombre:
                        <input type="text" placeholder="Escribe aquí tu nombre" required>
                    </label>
                    <label>Email:
                        <input type="email" placeholder="Email de contacto">
                    </label>
                    <label>Tipo de Consulta:
                        <select name="consulta" id="consulta" required>
                            <option value="consulta1">Información</option>
                            <option value="consulta2">Tallas</option>
                            <option value="consulta3">Disponibilidad</option>
                        </select>
                    </label>
                    <label>Dejanos un breve mensaje resumiendo tu consulta:
                        <textarea placeholder="Indíquenos cualquier información adicional sobre tu pedido"></textarea>
                    </label>
                    <button>
                        <span>Enviar</span>
                    </button>
                    
                </fieldset>
            </form> 
        </section>
        
    </main>
</body>
</html>
